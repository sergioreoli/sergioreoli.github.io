<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus repositórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bar: #ffffff;
  --card: #f5f5f5;
  --line: #d4d4d4;
  --text: #111111;
  --muted: #666666;
  --blue: #666666;
  --green: #666666;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side: 260px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--mono); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* ---------- Barra lateral ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); padding: 28px; z-index: 5; }
.side nav { display: flex; flex-direction: column; gap: 16px; }
.side nav a { color: var(--muted); text-decoration: none; letter-spacing: .02em; }
.side nav a span { margin-right: 14px; }
.side nav a:hover { color: var(--text); }

/* ---------- Conteúdo ---------- */
.page { margin-left: var(--side); padding: 0 40px 0 0; }
.hero { padding: 32px 0 36px; max-width: 1100px; }
h1 { margin: 0; font: 500 clamp(2.2rem, 5.5vw, 4.4rem)/1.1 var(--mono); letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero-row { display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
#avatar { width: 56px; height: 56px; border: 1px solid var(--line); }
.bio { margin: 16px 0 0; max-width: 720px; color: var(--muted); font: 400 1.15rem/1.6 var(--sans); }

/* Barra de abas fixa */
.tabs { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 14px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs ul { display: flex; gap: 36px; list-style: none; margin: 0; padding: 0; }
.tabs a { color: var(--muted); text-decoration: none; letter-spacing: .06em; font-size: .9rem; }
.tabs a:hover { color: var(--text); }
.btn { display: inline-block; padding: 9px 16px; background: var(--text); color: var(--bg); text-decoration: none;
  font: 500 .85rem var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--text); }
.btn:hover { background: transparent; color: var(--text); }

section { padding: 40px 0 8px; }
h2 { margin: 0 0 24px; font: 500 1.25rem var(--mono); }
h2 small { color: var(--muted); font-weight: 400; margin-left: 10px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
input, select { font: inherit; font-size: .9rem; padding: 11px 14px; border: 1px solid var(--line); border-radius: 0;
  background: var(--card); color: var(--text); }
input::placeholder { color: var(--muted); }
input[type=search] { flex: 1 1 260px; }
select { cursor: pointer; }

.dots { height: 20px; margin: 8px 0 24px; opacity: .5;
  background-image: radial-gradient(circle, #b0b0b0 1px, transparent 1.2px); background-size: 8px 8px; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 116px; }
.card:hover { border-color: #999999; }
.idx { color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.name { font-weight: 600; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.name:hover { color: var(--blue); }
.sec { color: var(--muted); font-size: .9rem; }
.stars { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.lang { color: var(--green); font-size: .85rem; white-space: nowrap; }
.desc { margin: 4px 0 0; color: var(--muted); font: 400 .88rem/1.5 var(--sans); flex: 1; }
.site { align-self: flex-start; margin-top: 6px; font-size: .8rem; color: var(--blue); text-decoration: none; }
.site:hover { text-decoration: underline; }
code { font: .78rem var(--mono); color: var(--muted); }
.status { color: var(--muted); padding: 24px 0; }
.apps-list { max-width: 1000px; margin: 0; padding: 0; list-style: none; }
.apps-list li { display: grid; grid-template-columns: minmax(120px, .8fr) minmax(160px, 1fr) minmax(200px, 1.4fr);
  gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: baseline; }
.apps-list li:last-child { border-bottom: 1px solid var(--line); }
.app-name { font-weight: 600; text-decoration: none; }
.app-name:hover, .app-link:hover { color: var(--blue); }
.app-desc { color: var(--muted); font: 400 .9rem/1.5 var(--sans); }
.app-link { color: var(--blue); font-size: .85rem; overflow-wrap: anywhere; }
.app-command { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }

footer { margin-top: 64px; padding: 24px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
footer a { color: var(--text); }

/* ---------- Mobile ---------- */
@media (max-width: 860px) {
  .side { position: static; width: auto; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
  .side nav { flex-direction: row; gap: 20px; }
  .side nav a span { display: none; }
  .page { margin: 0; padding: 0 20px; }
  .tabs ul { gap: 20px; }
  .tabs .btn { display: none; }
}
@media (max-width: 640px) {
  .apps-list li { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>

<aside class="side">
  <nav aria-label="Navegação">
    <a href="#repos"><span>[1]</span>Repositórios</a>
    <a href="#apps-section"><span>[2]</span>Aplicativos</a>
  </nav>
</aside>

<div class="page">
  <header class="hero" id="profile">
    <div class="hero-row">
      <img id="avatar" alt="" hidden>
    </div>
    <h1 id="name">Meus repositórios</h1>
    <p class="bio" id="bio">Carregando perfil…</p>
  </header>

  <div class="tabs">
    <ul>
      <li><a href="#repos">Repositórios</a></li>
      <li><a href="#apps-section">Aplicativos</a></li>
    </ul>
    <a class="btn" id="gh-link" href="https://github.com/sergioreoli" target="_blank" rel="noopener">Ver no GitHub</a>
  </div>

  <main>
    <section id="repos" aria-labelledby="repos-title">
      <h2 id="repos-title">Repositórios<small id="count"></small></h2>
      <div class="controls">
        <input type="search" id="search" placeholder="Buscar repositório" aria-label="Buscar repositório">
        <select id="sort" aria-label="Ordenar por">
          <option value="updated">Mais recentes</option>
          <option value="stars">Mais estrelas</option>
          <option value="name">Nome (A–Z)</option>
        </select>
      </div>
      <div id="status" class="status">Carregando repositórios…</div>
      <div id="grid" class="grid"></div>
    </section>

    <div class="dots" aria-hidden="true"></div>

    <section id="apps-section" aria-labelledby="apps-title">
      <h2 id="apps-title">Aplicativos open source que eu uso</h2>
      <ul id="apps" class="apps-list"></ul>
    </section>

  </main>

  <footer>Dados obtidos da <a href="https://docs.github.com/pt/rest" target="_blank" rel="noopener">API pública do GitHub</a>.</footer>
</div>

<script>
// >>>  USUÁRIO DO GITHUB <<<
const USERNAME = "sergioreoli";

const user = new URLSearchParams(location.search).get("user") || USERNAME;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
let repos = [];

$("gh-link").href = `https://github.com/${user}`;

async function load() {
  try {
    const [uRes, rRes] = await Promise.all([
      fetch(`https://api.github.com/users/${user}`),
      fetch(`https://api.github.com/users/${user}/repos?per_page=100&type=owner`)
    ]);
    if (!uRes.ok || !rRes.ok) throw new Error(uRes.status === 404
      ? `Usuário "${user}" não encontrado. Altere USERNAME no código.`
      : "Não foi possível acessar a API do GitHub agora (limite de requisições?). Tente mais tarde.");
    const u = await uRes.json();
    repos = (await rRes.json()).filter(r => !r.fork);

    document.title = `Repositórios de ${u.name || u.login}`;
    $("avatar").src = u.avatar_url;
    $("avatar").hidden = false;
    $("name").textContent = u.name || u.login;
    $("bio").textContent = u.bio || `${repos.length} repositórios públicos`;
    $("status").hidden = true;
    render();
  } catch (e) {
    $("bio").textContent = "";
    $("status").textContent = e.message;
  }
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const sort = $("sort").value;
  const list = repos
    .filter(r => (r.name + " " + (r.description || "") + " " + (r.language || "")).toLowerCase().includes(q))
    .sort((a, b) =>
      sort === "stars" ? b.stargazers_count - a.stargazers_count :
      sort === "name" ? a.name.localeCompare(b.name) :
      new Date(b.pushed_at) - new Date(a.pushed_at));

  $("grid").replaceChildren(...list.map(card));
  $("count").textContent = repos.length ? `${list.length}` : "";
  $("status").hidden = list.length > 0;
  if (!list.length) $("status").textContent = "Nenhum repositório encontrado.";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function card(r, i) {
  const c = el("article", "card");
  c.append(el("div", "idx", pad(i + 1)));

  const top = el("div", "row");
  const name = el("a", "name", r.name);
  name.href = r.html_url; name.target = "_blank"; name.rel = "noopener";
  top.append(name, el("span", "stars", `★ ${r.stargazers_count}`));

  const bottom = el("div", "row");
  bottom.append(
    el("span", "lang", r.language || ""),
    el("span", "sec", new Date(r.pushed_at).toLocaleDateString("pt-BR"))
  );

  c.append(top, bottom, el("p", "desc", r.description || "Sem descrição."));

  if (r.homepage) {
    const s = el("a", "site", "Ver site");
    s.href = /^https?:\/\//.test(r.homepage) ? r.homepage : "https://" + r.homepage;
    s.target = "_blank"; s.rel = "noopener";
    c.append(s);
  }
  return c;
}

$("search").addEventListener("input", render);
$("sort").addEventListener("change", render);

// >>>  SEUS APLICATIVOS OPEN SOURCE : (edite à vontade) <<<
const APPS = [
  { name: "Debian",      desc: "SO Linux",                      url: "https://debian.org" },
  { name: "LMDE",        desc: "SO Linux",                      url: "https://linuxmint.com" },
  { name: "Favnyr",      desc: "Gerenciador de arquivos",       url: "https://github.com/GlitchAwakened/Favnyr" },
  { name: "KeePassXC",   desc: "Gerenciador de senhas",         url: "https://keepassxc.org" },
  { name: "GenOffice",   desc: "Suite Office",                  url: "https://genoffice.ai" },
  { name: "VS Code",     desc: "Visual Studio Code",            url: "https://visualstudio.com" },
  { name: "OBS Studio",  desc: "Gravação e streaming",          url: "https://obsproject.com" },
  { name: "Drift",       desc: "Editor Vídeo",                  url: "https://cutwire.org/drift" },
  { name: "Inkscape",    desc: "Editor de gráficos vetoriais",  url: "https://inkscape.org" },
  { name: "Photon",      desc: "Editor Imagem",                 url: "flatpak install com.tenzen.photon" },
  { name: "Audacity",    desc: "Editor Áudio",                  url: "flatpak install org.audacityteam.Audacity" }
];

$("apps").replaceChildren(...APPS.map((a, i) => {
  const item = el("li");
  if (/^https?:\/\//.test(a.url)) {
    const name = el("a", "app-name", a.name);
    name.href = a.url; name.target = "_blank"; name.rel = "noopener";
    const link = el("a", "app-link", a.url.replace(/^https?:\/\//, ""));
    link.href = a.url; link.target = "_blank"; link.rel = "noopener";
    item.append(name, el("span", "app-desc", a.desc), link);
  } else {
    item.append(el("span", "app-name", a.name), el("span", "app-desc", a.desc), el("code", "app-command", a.url));
  }
  return item;
}));

load();
</script>
</body>
</html>
